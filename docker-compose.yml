# Local stack: Postgres + API + web. `docker compose up --build`, then open http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://atlas_app:atlas_app@db:5432/atlas_dev
      MIGRATION_DATABASE_URL: postgres://atlas:atlas@db:5432/atlas_dev
      JWT_SECRET: local-dev-secret-change-me
      AUTH_DEV_TOKENS: "true"
      NODE_ENV: development
      WORKERS_ENABLED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
